name: Build Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      save_artifact:
        description: Save the built APK as a downloadable artifact
        type: boolean
        default: false
  # Deliberately not scheduled (yet). The `maestro` job below runs entirely unverified code —
  # this sandbox has no adb/emulator/maestro tooling at all, so none of it has ever actually
  # executed. Per the original test-coverage plan's own rollout guidance, a human should trigger
  # it a few times via `workflow_dispatch` (or the `run-e2e-android` PR label) and watch it
  # directly before this workflow adds a `schedule:` trigger and widens the `maestro` job's `if`
  # to include `push`/`schedule`. See docs/testing.md.

# Cancel superseded runs on the same PR branch, but never a push to main — a merge should
# always finish and produce its artifact even if another merge follows quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No Gradle caching existed before this: every run recompiled from scratch and re-downloaded
      # Robolectric's ~50MB android-all jar (the Kotlin suite's first-run cost, since that jar is
      # not something Gradle's own dependency cache skips). Also a prerequisite for the `maestro`
      # job below to run in reasonable time, since it needs a build-apk run first either way.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci
      # Optional, and a no-op unless the repo has the secret set. `google-services.json` is
      # gitignored (it is per-Firebase-project), so without this step every APK this workflow
      # produces is local-alarms-only — the FCM backstop can never be exercised on a sideloaded
      # build no matter what the API is configured with. Writing it from a secret keeps the file
      # out of git while letting the workflow build the Firebase-enabled variant.
      #
      # The branch lives in the script rather than in an `if:` because the `secrets` context is
      # not available to step-level conditions. With no secret the file is never created, and
      # `app.config.ts`/`withMedGuardAlarms.ts` both fall back to the no-Firebase path that keeps
      # this build working for anyone without a Firebase project.
      - name: Write Firebase config if configured
        working-directory: apps/android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "google-services.json written: this APK includes the FCM push backstop."
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without FCM (local alarms only)."
          fi
      - name: Prebuild native Android project
        working-directory: apps/android
        run: npx expo prebuild --platform android
      # The only place this repo's Kotlin is executed rather than merely read. It lives here and
      # not in ci.yml because it needs the JDK and the `expo prebuild` output above — `ci.yml` has
      # neither. `ChimeSession` is deliberately Android-free so it can run as a plain JVM test:
      # the bug it pins down (two doses on the same minute leaving a looping MediaPlayer nothing
      # could stop) reached a household and rang for a whole Shabbat, precisely because the state
      # it corrupted sat inside a Service that nothing here could execute.
      #
      # Before `assembleRelease`, so a broken chime fails the build rather than shipping an APK.
      - name: Native alarm unit tests
        working-directory: apps/android/android
        # Gradle's `Test` task prints nothing at all when it passes, so a run that discovered no
        # tests looks exactly like a run where every test passed — and "the chime suite is green"
        # is not a claim worth resting on an absence of output. The JUnit XML Gradle always writes
        # is read back: the counts go in the log, and discovering nothing fails the step.
        run: |
          set -euo pipefail
          ./gradlew :medguard-alarms:testDebugUnitTest
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          results = sorted(
              glob.glob('../modules/medguard-alarms/android/build/test-results/**/TEST-*.xml',
                        recursive=True)
          )
          if not results:
              sys.exit('::error::No JUnit results written — the native alarm unit tests did not run.')

          total = failed = skipped = 0
          for path in results:
              suite = ET.parse(path).getroot()
              total += int(suite.get('tests', 0))
              failed += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
              skipped += int(suite.get('skipped', 0))
              print(f"  {suite.get('name')}: {suite.get('tests')} tests")

          print(f'Native alarm unit tests: {total} run, {failed} failed, {skipped} skipped')
          if total == 0:
              sys.exit('::error::No tests were discovered in :medguard-alarms.')
          # A floor, not just a zero-check: 70 tests exist across 10 files as of the Robolectric
          # suite landing (2026-08-16). A Gradle/AGP config change that silently stops discovering
          # most of them — everything still "passes" because nothing ran — must fail loudly the
          # same way zero-discovered already does, not read as a green build.
          if total < 60:
              sys.exit(f'::error::Only {total} native alarm unit tests were discovered — expected at least 60.')
          if failed:
              sys.exit(f'::error::{failed} native alarm unit test(s) failed.')
          PY

      # `if: always()` — a failing native suite is exactly when these results are worth being able
      # to open without re-running the job.
      - name: Upload native alarm test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-alarm-test-results
          path: apps/android/modules/medguard-alarms/android/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Build release APK
        working-directory: apps/android/android
        # `debug` builds don't embed the JS bundle — they expect a Metro server reachable at
        # install time, which a sideloaded APK never has ("Unable to load script" on launch).
        # `release` triggers Gradle's bundleReleaseJsAndAssets, embedding index.android.bundle
        # into assets. The RN template's `release` signingConfig defaults to the debug keystore
        # (no real signing set up), so this stays installable without any secrets.
        run: ./gradlew assembleRelease
      # Every push to main (i.e. every merge) uploads the APK, with the default 90-day retention.
      # PR runs now upload too — short retention, since the only reason a PR needs this artifact
      # is so the `maestro` job below (label-gated, not every PR) can install it; nobody needs a
      # PR-build APK to stick around after that. Manual workflow_dispatch runs — e.g. building a
      # side branch to hand someone an APK — only upload when save_artifact is checked, since most
      # ad-hoc runs are just "does this still build" checks.
      - name: Upload APK
        if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.save_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: medguard-release-apk
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 90 }}

  maestro:
    name: Android E2E (Maestro, emulator)
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # See the comment on this workflow's `on:` block: this job's every dependency — the emulator
    # runner action, `adb root` against a google_apis image, the three .maestro/ flows, the two
    # e2e/*.sh driver scripts — was written with no way to run any of it locally, so it starts
    # human-triggered only rather than wired into every PR or a nightly schedule.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e-android')
    steps:
      - uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: medguard-release-apk
          path: apk

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The difference between a ~90s and a ~6min emulator boot.
      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb_keys
          key: avd-api33-google_apis-x86_64-v1

      - name: Run Maestro flows and adb driver scripts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          # Deliberately google_apis, not google_play: only a google_apis image is rootable, and
          # `adb root` is required — NotificationActionReceiver and DoseAlarmService are both
          # android:exported="false" (plugins/withMedGuardAlarms.ts), so `am broadcast -n` from
          # the plain shell UID gets a Permission Denial. This is a deliberate divergence from the
          # *manual* QA drill in docs/android-client-plan.md, which recommends google_play for a
          # more production-representative image — see apps/android/e2e/alarm-action.sh.
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            adb root
            adb wait-for-device
            adb install -r apk/app-release.apk
            maestro test apps/android/.maestro/offline-smoke.yaml
            bash apps/android/e2e/boot-rearm.sh
            bash apps/android/e2e/alarm-action.sh
