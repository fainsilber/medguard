# Shared by every top-level flow in ../*.yaml. `CaregiverGate` (src/identity/CaregiverGate.tsx)
# is the app's entry point: nothing behind it renders until a caregiver name exists on the
# device. Since `launchApp` here deliberately does NOT clearState (boot-rearm.yaml and
# alarm-notification-action.yaml both need the app already force-stopped and relaunched mid-flow,
# which a wipe would defeat), this has to tolerate two different starting points: a brand-new
# install showing the onboarding choice, or a device that already has a caregiver name saved from
# a previous run. `runFlow.when` makes both safe to include unconditionally.
- runFlow:
    when:
      visible: "Use this device on its own for now"
    commands:
      - tapOn: "Use this device on its own for now"
      - tapOn: "e.g. Mom, Dad, Grandma"
      - inputText: "Maestro Caregiver"
      - hideKeyboard
      - tapOn: "Continue"
