# Pins the Android SDK level every Robolectric test in this module runs against, independent of
# build.gradle's compileSdk/targetSdk (36 as of this writing). Without this, Robolectric picks a
# default from the manifest's targetSdk and fails every single @RunWith(RobolectricTestRunner)
# class with "IllegalArgumentException at DefaultSdkPicker" the moment that target level is newer
# than what the pinned `org.robolectric:robolectric:4.13` release ships shadow/android-all support
# for — exactly what happened in CI the first time this suite actually ran (this sandbox has no
# way to run Gradle at all, so this could not be caught before pushing).
#
# 34 (Android 14, UPSIDE_DOWN_CAKE) rather than a lower level: AlarmSchedulerTest and
# MedGuardChannelsTest exercise API 31+ (`AlarmManager.canScheduleExactAlarms()`) and API 33+
# (`POST_NOTIFICATIONS`, notification channel importance) behavior specifically, so the pinned
# level needs to be at least that — and 34 is a well-established Robolectric target, unlike 36.
sdk=34
