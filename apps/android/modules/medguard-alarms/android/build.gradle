plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.medguard.alarms'
version = '0.1.0'

android {
  namespace "com.medguard.alarms"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Sprint A4's `MedGuardHeadlessService` uses `HeadlessJsTaskService`/`Arguments`/
  // `HeadlessJsTaskConfig` directly. `expo-module-gradle-plugin` puts `expo-modules-core` on this
  // module's classpath, but expo-modules-core's own dependency on react-android
  // (node_modules/expo-modules-core/android/build.gradle) is declared `implementation`, not `api`
  // — so it isn't exposed transitively, and this module needs the same declaration itself. No
  // version pin, matching expo-modules-core exactly: React Native's own Gradle plugin aligns the
  // version across the whole build.
  implementation 'com.facebook.react:react-android'

  // Sprint A4. Compiled in unconditionally so `MedGuardMessagingService` builds even for the
  // sideloadable APK, which has no Firebase project (see `plugins/withMedGuardAlarms.ts`). The
  // *manifest* entry and the Google Services Gradle plugin are what stay conditional on a
  // `google-services.json` being present — so without one the class exists and is simply never
  // instantiated, rather than the build failing for a household that only uses local alarms.
  implementation 'com.google.firebase:firebase-messaging:24.0.0'

  // `MediaSessionCompat` + `VolumeProviderCompat`, which is how `DoseAlarmService` receives a
  // volume-key press while the chime is on the alarm stream — one of the "a button was pressed"
  // stop conditions. Not available from `expo-module-gradle-plugin`'s own classpath.
  implementation 'androidx.media:media:1.7.0'

  // `ChimeSessionTest` — the decision layer of the chime (which doses are sounding, when the
  // sound stops, what silences it early) is a plain Kotlin class precisely so it can be proven
  // here rather than only on a phone. Run by `.github/workflows/android-apk.yml` after prebuild.
  testImplementation 'junit:junit:4.13.2'
}
